name: Daily upstream source sync

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
      timezone: "Europe/Ljubljana"

permissions:
  contents: write

concurrency:
  group: zitadel-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fast-forward fork main from zitadel/zitadel
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh repo sync "$FORK_REPO" --branch main --source zitadel/zitadel
          echo "Fork main is synced with upstream main."

# No force, no pull requests, no application-code commits, no tag pushes.
